# Edge routing for a single-host deployment. In the cloud, a CDN/load balancer plays this role.
# /api and /media go straight to the API (no extra hop through Next.js); everything else → web.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

upstream api { server api:4000; keepalive 32; }
upstream web { server web:3000; keepalive 32; }

server {
  listen 80;
  server_name _;
  client_max_body_size 16m;           # image uploads (API limit is 15 MB)
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_read_timeout 120s;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  location = /api/v1/admin/auth/login { limit_req zone=api_auth burst=5 nodelay; proxy_pass http://api; }
  location /api/v1/ { limit_req zone=api_general burst=40 nodelay; proxy_pass http://api; }
  location /media/ { proxy_pass http://api; proxy_cache_valid 200 1y; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /health { proxy_pass http://api; }
  location /_next/static/ { proxy_pass http://web; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { proxy_pass http://web; }
}
